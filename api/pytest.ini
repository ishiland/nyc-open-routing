[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = --strict-markers --no-header
asyncio_default_fixture_loop_scope = function
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration test
    unit: marks tests as unit test

[coverage:run]
source = api
omit = 
    */tests/*
    */migrations/*
    */conftest.py
    api/app.py
    api/__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    raise ImportError
    except ImportError
    DEBUG
    if TYPE_CHECKING: 