name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      api: ${{ steps.filter.outputs.api }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          client:
            - 'client/**'
          api:
            - 'api/**'
          docker:
            - 'api/**'
            - 'docker/**'
            - 'docker-compose.yml'

  client:
    name: Client CI
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 23
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install dependencies
      working-directory: ./client
      run: npm ci

    - name: Type checking
      working-directory: ./client
      run: npm run type-check

    - name: Linting
      working-directory: ./client
      run: npm run lint:check

    - name: Run tests
      working-directory: ./client
      run: npm test

    - name: Build
      working-directory: ./client
      run: npm run build

  api:
    name: API CI
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: api/requirements.txt

    - name: Install dependencies
      working-directory: ./api
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      working-directory: ./api
      run: |
        flake8 . --count --statistics

    - name: Check formatting with black
      working-directory: ./api
      run: |
        black --check .

    - name: Check imports with isort
      working-directory: ./api
      run: |
        isort --check .

    - name: Run tests with coverage
      working-directory: ./api
      env:
        PYTHONPATH: .
      run: |
        pytest --cov=api --cov-report=xml --cov-report=term \
          --ignore=tests/test_routes.py \
          --ignore=tests/test_health.py \
          --ignore=tests/test_smoke.py

    - name: Upload coverage report
      uses: codecov/codecov-action@v5
      with:
        file: ./api/coverage.xml
        flags: api
        fail_ci_if_error: false

  docker:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-latest
    needs: [changes, api]
    if: always() && needs.changes.outputs.docker == 'true' && needs.api.result != 'failure'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build API Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./api
        file: ./docker/dev/api.Dockerfile
        push: false
        load: true
        tags: nyc-open-routing-api:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke test API container
      run: |
        docker run -d --name api-test -p 5000:5000 nyc-open-routing-api:test
        sleep 5  # Give container time to start
        curl --fail --retry 5 --retry-delay 1 --retry-connrefused http://localhost:5000/api/docs || (docker logs api-test && exit 1)
        docker stop api-test
